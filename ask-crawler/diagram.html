<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crawler — Module Diagram</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const LAYERS = [
      {
        id: "external",
        label: "External System",
        color: "#94a3b8",
        textColor: "#0f172a",
        modules: [{ id: "ext", label: "External System", description: "Отправляет CrawlTaskRequest, получает события через RabbitMQ" }],
      },
      {
        id: "infra",
        label: "infra/",
        color: "#6366f1",
        textColor: "#fff",
        modules: [
          { id: "amqp_consumer", label: "amqp/consumer", description: "Подписывается на crawler.tasks (входящие задачи) и scraper.results (результаты от Scraper). Передаёт в CrawlerService и Worker соответственно." },
          { id: "amqp_publisher", label: "amqp/publisher", description: "Публикует в render.requests (URL для Renderer), а также PageScrapedEvent, TaskCompletedEvent, TaskFailedEvent в crawler.events." },
          { id: "redis_infra", label: "redis/", description: "Клиент и хелперы для работы с Redis. Используется domain/frontier и domain/job." },
          { id: "postgres_infra", label: "postgres/", description: "sqlc-генерированный код. Персистентные записи о задачах и обработанных страницах." },
        ],
      },
      {
        id: "app",
        label: "app/",
        color: "#0ea5e9",
        textColor: "#fff",
        modules: [
          { id: "crawler_svc", label: "crawler.go", description: "CrawlerService. Принимает задачу, инициализирует Job, загружает robots.txt, формирует seed URLs, запускает пул воркеров." },
          { id: "worker", label: "worker.go", description: "Worker. Берёт URL из Frontier → публикует в render.requests → получает ScrapeResponse из scraper.results → фильтрует ссылки → добавляет в Frontier." },
        ],
      },
      {
        id: "domain",
        label: "domain/",
        color: "#10b981",
        textColor: "#fff",
        modules: [
          { id: "frontier", label: "frontier/", description: "interface Frontier: Push, Pop, Size — публичный контракт модуля.\nlib/: хелперы для Redis-ключей.\nimpl/: RedisFrontier — ZSET по глубине, TTL на in-flight URL для retry зависших." },
          { id: "filter", label: "filter/", description: "interface URLFilter: Allow(url, depth) bool — публичный контракт.\nlib/: внутренние хелперы компиляции regex и т.п.\nimpl/: ChainFilter объединяет DomainFilter, DepthFilter, PatternFilter." },
          { id: "robots", label: "robots/", description: "interface RobotsChecker: Allowed(url) bool — публичный контракт.\nlib/: внутренние структуры парсера robots.txt.\nimpl/: загружает, парсит и кэширует robots.txt." },
          { id: "job", label: "job/", description: "interface JobStore + типы Job, JobStatus — публичный контракт.\nlib/: внутренние хелперы (не нужны снаружи).\nimpl/: RedisJobStore — счётчики, статус, visited set (SISMEMBER/SADD)." },
        ],
      },
    ];

    const EDGES = [
      { from: "ext", to: "amqp_consumer", label: "CrawlTaskRequest" },
      { from: "amqp_consumer", to: "crawler_svc", label: "TaskRequest" },
      { from: "crawler_svc", to: "worker", label: "spawn workers" },
      { from: "crawler_svc", to: "robots", label: "check robots.txt" },
      { from: "crawler_svc", to: "job", label: "init job" },
      { from: "worker", to: "frontier", label: "push/pop URL" },
      { from: "worker", to: "filter", label: "filter links" },
      { from: "worker", to: "job", label: "update stats" },
      { from: "worker", to: "amqp_publisher", label: "render.requests" },
      { from: "amqp_consumer", to: "worker", label: "scraper.results" },
      { from: "crawler_svc", to: "amqp_publisher", label: "TaskCompleted / TaskFailed" },
      { from: "amqp_publisher", to: "ext", label: "events" },
      { from: "frontier", to: "redis_infra", label: "" },
      { from: "job", to: "redis_infra", label: "" },
      { from: "job", to: "postgres_infra", label: "" },
    ];

    function App() {
      const [selected, setSelected] = useState(null);
      const [hoveredLayer, setHoveredLayer] = useState(null);

      const allModules = LAYERS.flatMap(l =>
        l.modules.map(m => ({ ...m, layerId: l.id, layerColor: l.color, layerLabel: l.label }))
      );
      const selectedModule = allModules.find(m => m.id === selected);
      const relatedEdges = selected ? EDGES.filter(e => e.from === selected || e.to === selected) : [];
      const relatedIds = new Set(relatedEdges.flatMap(e => [e.from, e.to]));

      return (
        <div style={{
          fontFamily: "'JetBrains Mono', 'Fira Code', monospace",
          background: "#0d1117",
          minHeight: "100vh",
          color: "#e2e8f0",
          display: "flex",
          flexDirection: "column",
          padding: "32px",
          gap: "24px",
        }}>
          <div>
            <div style={{ fontSize: "11px", letterSpacing: "0.2em", color: "#475569", textTransform: "uppercase", marginBottom: "4px" }}>architecture</div>
            <div style={{ fontSize: "22px", fontWeight: 700, color: "#f1f5f9", letterSpacing: "-0.02em" }}>Crawler — Module Diagram</div>
          </div>

          <div style={{ display: "flex", gap: "24px", alignItems: "flex-start", flexWrap: "wrap" }}>

            {/* Diagram */}
            <div style={{ flex: "1 1 500px", display: "flex", flexDirection: "column", gap: "12px" }}>
              {LAYERS.map(layer => (
                <div
                  key={layer.id}
                  onMouseEnter={() => setHoveredLayer(layer.id)}
                  onMouseLeave={() => setHoveredLayer(null)}
                  style={{
                    border: `1px solid ${hoveredLayer === layer.id ? layer.color + "88" : "#1e293b"}`,
                    borderRadius: "10px",
                    padding: "14px 16px",
                    background: hoveredLayer === layer.id ? layer.color + "08" : "#111827",
                    transition: "all 0.2s",
                  }}
                >
                  <div style={{ fontSize: "10px", letterSpacing: "0.15em", textTransform: "uppercase", color: layer.color, marginBottom: "10px", fontWeight: 600 }}>
                    {layer.label}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: "8px" }}>
                    {layer.modules.map(mod => {
                      const isSelected = selected === mod.id;
                      const isRelated = relatedIds.has(mod.id);
                      const dimmed = selected && !isSelected && !isRelated;
                      return (
                        <button
                          key={mod.id}
                          onClick={() => setSelected(selected === mod.id ? null : mod.id)}
                          style={{
                            background: isSelected ? layer.color : isRelated ? layer.color + "22" : "#1e293b",
                            color: isSelected ? layer.textColor : dimmed ? "#334155" : "#cbd5e1",
                            border: `1px solid ${isSelected ? layer.color : isRelated ? layer.color + "66" : "#334155"}`,
                            borderRadius: "6px",
                            padding: "6px 12px",
                            fontSize: "12px",
                            cursor: "pointer",
                            fontFamily: "inherit",
                            fontWeight: isSelected ? 600 : 400,
                            transition: "all 0.15s",
                            opacity: dimmed ? 0.35 : 1,
                            letterSpacing: "0.02em",
                          }}
                        >
                          {mod.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}

              {/* Legend */}
              <div style={{ display: "flex", gap: "16px", marginTop: "4px", flexWrap: "wrap" }}>
                {LAYERS.map(l => (
                  <div key={l.id} style={{ display: "flex", alignItems: "center", gap: "6px", fontSize: "11px", color: "#475569" }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", background: l.color }} />
                    {l.label}
                  </div>
                ))}
              </div>
            </div>

            {/* Info Panel */}
            <div style={{
              flex: "0 0 280px",
              background: "#111827",
              border: "1px solid #1e293b",
              borderRadius: "10px",
              padding: "20px",
              minHeight: "200px",
            }}>
              {selectedModule ? (
                <>
                  <div style={{ fontSize: "10px", letterSpacing: "0.15em", textTransform: "uppercase", color: selectedModule.layerColor, marginBottom: "8px", fontWeight: 600 }}>
                    {selectedModule.layerLabel}
                  </div>
                  <div style={{ fontSize: "15px", fontWeight: 700, color: "#f1f5f9", marginBottom: "16px" }}>
                    {selectedModule.label}
                  </div>
                  <div style={{ fontSize: "12px", color: "#94a3b8", lineHeight: 1.7, whiteSpace: "pre-line", marginBottom: "20px" }}>
                    {selectedModule.description}
                  </div>
                  {relatedEdges.length > 0 && (
                    <>
                      <div style={{ fontSize: "10px", letterSpacing: "0.15em", textTransform: "uppercase", color: "#475569", marginBottom: "10px" }}>
                        Связи
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", gap: "6px" }}>
                        {relatedEdges.map((e, i) => {
                          const isOut = e.from === selected;
                          const otherId = isOut ? e.to : e.from;
                          const otherMod = allModules.find(m => m.id === otherId);
                          return (
                            <div key={i} style={{
                              display: "flex", alignItems: "center", gap: "8px",
                              fontSize: "11px", background: "#0d1117", borderRadius: "5px", padding: "5px 8px",
                            }}>
                              <span style={{ color: isOut ? "#6366f1" : "#10b981", fontSize: "13px" }}>{isOut ? "→" : "←"}</span>
                              <span style={{ color: "#94a3b8" }}>{otherMod?.label}</span>
                              {e.label && <span style={{ color: "#475569", fontSize: "10px", marginLeft: "auto" }}>{e.label}</span>}
                            </div>
                          );
                        })}
                      </div>
                    </>
                  )}
                </>
              ) : (
                <div style={{ display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", height: "160px", gap: "8px" }}>
                  <div style={{ fontSize: "24px", opacity: 0.2 }}>⬡</div>
                  <div style={{ fontSize: "12px", color: "#334155", textAlign: "center" }}>
                    Нажми на модуль<br />чтобы увидеть детали
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Flow */}
          <div style={{ background: "#111827", border: "1px solid #1e293b", borderRadius: "10px", padding: "16px 20px" }}>
            <div style={{ fontSize: "10px", letterSpacing: "0.15em", textTransform: "uppercase", color: "#475569", marginBottom: "12px" }}>
              Основной поток
            </div>
            <div style={{ display: "flex", alignItems: "center", flexWrap: "wrap", rowGap: "8px" }}>
              {[
                { label: "consumer", color: "#6366f1" },
                { label: "CrawlerService", color: "#0ea5e9" },
                { label: "robots/ + job/", color: "#10b981" },
                { label: "Worker pool", color: "#0ea5e9" },
                { label: "render.requests", color: "#6366f1" },
                { label: "Renderer → Scraper", color: "#94a3b8" },
                { label: "scraper.results", color: "#6366f1" },
                { label: "frontier/ + filter/", color: "#10b981" },
                { label: "publisher → External", color: "#6366f1" },
              ].map((step, i, arr) => (
                <div key={i} style={{ display: "flex", alignItems: "center" }}>
                  <div style={{
                    background: step.color + "18",
                    border: `1px solid ${step.color}44`,
                    color: step.color,
                    borderRadius: "5px",
                    padding: "4px 10px",
                    fontSize: "11px",
                    fontWeight: 500,
                    whiteSpace: "nowrap",
                  }}>
                    {step.label}
                  </div>
                  {i < arr.length - 1 && <div style={{ color: "#334155", fontSize: "14px", padding: "0 4px" }}>→</div>}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
