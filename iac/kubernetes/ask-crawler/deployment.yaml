apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-crawler
  namespace: askorium
  labels:
    app: ask-crawler
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ask-crawler
  template:
    metadata:
      labels:
        app: ask-crawler
    spec:
      containers:
        - name: ask-crawler
          image: ghcr.io/umu-art/ask-crawler:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - secretRef:
                name: ask-crawler

          env:
            - name: CRAWLER_BATCH_MODE
              value: "true"

#          livenessProbe:
#            httpGet:
#              path: /
#              port: 8080
#            initialDelaySeconds: 10
#            periodSeconds: 15
#            failureThreshold: 3
#
#          readinessProbe:
#            httpGet:
#              path: /
#              port: 8080
#            initialDelaySeconds: 10
#            periodSeconds: 10
#            failureThreshold: 3

          resources:
            requests:
              cpu: "20m"
              memory: "4G"
            limits:
              memory: "4G"

          securityContext:
            allowPrivilegeEscalation: false

      imagePullSecrets:
        - name: github-container-registry

      restartPolicy: Always
