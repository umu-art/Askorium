apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ask-trafilatura
  namespace: askorium
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: ask-trafilatura
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ask-trafilatura
