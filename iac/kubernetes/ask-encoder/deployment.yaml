apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-encoder
  namespace: askorium
  labels:
    app: ask-encoder
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ask-encoder
  template:
    metadata:
      labels:
        app: ask-encoder
    spec:
      containers:
        - name: ask-encoder
          image: ghcr.io/umu-art/ask-encoder:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3

          resources:
            requests:
              cpu: "200m"
              memory: "2500M"
            limits:
              cpu: "2000m"
              memory: "2500M"

          securityContext:
            allowPrivilegeEscalation: false

      imagePullSecrets:
        - name: github-container-registry

      restartPolicy: Always
