apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ask-encoder
  namespace: askorium
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: ask-encoder
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ask-encoder
