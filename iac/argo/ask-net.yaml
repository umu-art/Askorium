apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ask-net
  namespace: argocd
spec:
  destination:
    namespace: askorium
    server: https://kubernetes.default.svc
  source:
    path: iac/kubernetes/ask-net
    repoURL: https://github.com/umu-art/askorium
    targetRevision: HEAD
    directory:
      recurse: true
  project: askorium
