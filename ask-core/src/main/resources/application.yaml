askorium:
  api:
    self-url: ${ASK_CORE_URL:http://localhost:8080}
    encoder-url: ${ASK_ENCODER_URL:http://localhost:8000}

  scrapper:
    scrapper-request-queue-name: askorium.crawler.input
    scrapper-response-queue-name: askorium.crawler.output
    min-block-length: 100
    max-block-length: 1000

  index:
    text-index-name: askorium-texts
    vector-index-name: askorium-vectors
    vector-dimension: 1024
    hnsw-m: 16
    hnsw-ef-construction: 100

  search:
    modes:
      FAST:
        bm25-size: 50
        knn-size: 50
        rrf-k: 60
        rerank-top-n: 10
      DEEP:
        bm25-size: 100
        knn-size: 100
        rrf-k: 60
        rerank-top-n: 20

  user:
    rate-limit:
      requests-per-minute: 60

spring:
  application:
    name: ask-core

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration

  temporal:
    connection:
      target: ${TEMPORAL_URL:localhost:7233}
    workers-auto-discovery:
      packages:
        - ru.askorium.core.search.workflow

  threads:
    virtual:
      enabled: true

  jackson:
    default-property-inclusion: non_null

  datasource:
    hikari:
      jdbc-url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/postgres?user=postgres&password=postgres}
      minimum-idle: 2
      maximum-pool-size: 50
      connection-test-query: 'select 1'
      data-source-properties:
        socketTimeout: 30

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_batch_fetch_size: 500

  data:
    elasticsearch:
      repositories:
        enabled: false

    redis:
      url: ${REDIS_URL:redis://localhost:6379/0}
      repositories:
        enabled: false

  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672/}

  ai:
    openai:
      api-key: ${OPENROUTER_TOKEN}
      base-url: ${OPENROUTER_URL}
      chat:
        options:
          model: google/gemini-2.5-flash

  web:
    resources:
      add-mappings: false

opensearch:
  uris: ${ELASTICSEARCH_URL:http://localhost:9200}

server:
  servlet:
    encoding:
      force: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    ssl:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    ru.askorium: trace
    ru.askorium.core.common.RestTemplateFactory: info
