openapi: 3.1.0

info:
  title: Scrapper Api
  description: Минимальный api для скраппинга страницы.
  version: 1.0.0

paths:
  /stub:
    get:
      tags:
        - scrapper
      operationId: stub
      summary: Заглушка для успешной генерации моделей.
      responses:
        200:
          description: Успешный ответ от заглушки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScrapeResponse'

components:
  schemas:
    ScrapeResponse:
      type: object
      required:
        - task_id
        - success
      properties:
        task_id:
          type: string
          format: uuid
        success:
          type: boolean
          description: Итоговый результат выполнения
        page:
          description: Возвращается при успехе
          $ref: '#/components/schemas/ScrappedPage'
        error:
          description: Возвращается при ошибке
          $ref: '#/components/schemas/ScrapeError'
        metadata:
          type: object
          additionalProperties: true

    ScrapeError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string

    ErrorCode:
      type: string
      enum:
        - TIMEOUT
        - NETWORK_ERROR
        - RATE_LIMITED
        - PAGE_NOT_FOUND
        - ACCESS_DENIED
        - INVALID_URL
        - PARSE_ERROR

    ScrappedPage:
      type: object
      required:
        - url
        - title
        - blocks
      properties:
        url:
          type: string
          description: URL страницы.
        title:
          type: string
          description: Заголовок страницы
        description:
          type: string
          description: Описание страницы
        previewUrl:
          type: string
          description: Ссылка на превью страницы
        iconUrl:
          type: string
          description: Ссылка на иконку страницы
        language:
          type: string
          description: Язык страницы (например "ru", "en"), если определён.
        lastModified:
          type: string
          format: date-time
          description: Дата последнего изменения, если доступна.
        blocks:
          type: array
          description: Логические блоки текста (заголовки, абзацы).
          items:
            $ref: '#/components/schemas/ContentBlock'
        links:
          type: array
          description: Точные ссылки.
          items:
            $ref: '#/components/schemas/Link'
        documents:
          type: array
          description: Вложения (изображения, PDF и т.п.) с возможным описанием/текстом.
          items:
            $ref: '#/components/schemas/Document'

    ContentBlock:
      type: object
      required:
        - type
        - text
      properties:
        htmlId:
          type: string
        type:
          description: Тип блока.
          $ref: '#/components/schemas/ContentBlockType'
        headingLevel:
          type: integer
          minimum: 1
          maximum: 6
          description: Уровень заголовка (для type=heading).
        text:
          type: string
          description: Очищённый текст блока.

    Link:
      description: Ссылка со страницы
      type: object
      required:
        - href
        - type
        - position
      properties:
        href:
          type: string
          description: Целевой URL ссылки.
        type:
          description: Внутренняя (внутри домена) или внешняя ссылка.
          $ref: '#/components/schemas/LinkType'
        anchorText:
          type: string
          description: Текст анкера (если есть).
        contextBlockId:
          type: string
          description: ID блока, внутри которого находится ссылка.
        position:
          type: integer
          description: Начальная позиция ссылки внутри блока.
        snippet:
          type: string
          description: Небольшой контекст вокруг ссылки (короткий сниппет).

    Document:
      type: object
      required:
        - url
        - mimeType
      properties:
        url:
          type: string
          description: Ссылка на документ/изображение.
        mimeType:
          type: string
          description: MIME-тип (image/jpeg, application/pdf и т.п.).
        sizeBytes:
          type: integer
          description: Размер в байтах (если доступен).
        extractedText:
          type: string
          description: Текст, извлечённый из файла (OCR / PDF text), если был извлечён.
        description:
          type: string
          description: Короткое текстовое описание (alt, caption или сгенерированное моделью).
        descriptionSource:
          description: Источник описания.
          $ref: '#/components/schemas/DocumentDescriptionSourceType'

    ContentBlockType:
      type: string
      description: Тип блока контента.
      enum:
        - heading
        - paragraph
        - listItem
      example: paragraph

    LinkType:
      type: string
      description: Тип ссылки (внутри домена или внешняя).
      enum:
        - internal
        - external
      example: internal

    DocumentDescriptionSourceType:
      type: string
      description: Источник описания документа.
      enum:
        - heading
        - paragraph
        - listItem
      example: paragraph