openapi: 3.1.0

info:
  title: Renderer Api
  description: Контракт сообщений для сервиса рендеринга страниц.
  version: 2.0.0

paths:
  /stub:
    get:
      tags:
        - renderer
      operationId: stub
      summary: Заглушка для успешной генерации моделей.
      responses:
        200:
          description: Успешный ответ от заглушки
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/RenderInput'
                  - $ref: '#/components/schemas/RenderOutput'

components:
  schemas:
    RenderInput:
      type: object
      required:
        - task_id
        - url
      properties:
        task_id:
          type: string
          format: uuid
          description: Уникальный идентификатор задачи
        url:
          type: string
          format: uri
          description: URL страницы для рендеринга
        timeout_ms:
          type: integer
          default: 15000
          minimum: 1000
          maximum: 60000
          description: Таймаут загрузки страницы (миллисекунды)
        metadata:
          type: object
          description: Сквозные данные, возвращаются без изменений
          additionalProperties: true

    RenderOutput:
      type: object
      required:
        - task_id
        - url
        - success
      properties:
        task_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        success:
          type: boolean
          description: Итоговый результат рендеринга
        html:
          type: string
          description: HTML-содержимое страницы (при успехе)
        elapsed_ms:
          type: integer
          description: Время рендеринга в миллисекундах (при успехе)
        error:
          description: Информация об ошибке (при неудаче)
          $ref: '#/components/schemas/RenderError'
        metadata:
          type: object
          additionalProperties: true

    RenderError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/RenderErrorCode'
        message:
          type: string
          description: Описание ошибки

    RenderErrorCode:
      type: string
      enum:
        - TIMEOUT
        - NETWORK_ERROR
        - PAGE_NOT_FOUND
        - ACCESS_DENIED
        - INVALID_URL
        - PARSE_ERROR
