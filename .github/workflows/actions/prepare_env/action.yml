name: "Prepare env"
description: "Set up runtimes (Java, Node, Python, Go), install Redocly, and generate API code"

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Install python libs
      shell: bash
      run: pip install pyyaml build setuptools wheel pytest

    - name: Set up Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install redocly
      shell: bash
      run: npm i -g @redocly/cli@latest

    - name: Generate API
      shell: bash
      run: python api/build.py
