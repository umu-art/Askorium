name: "Prepare env"
description: "Подготовка окружения для пайпы, установка java, node, python, go"

runs:
  using: "composite"
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js 22
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up Python 3.14
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Set up Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install redocly
      shell: bash
      run: npm i -g @redocly/cli@latest
